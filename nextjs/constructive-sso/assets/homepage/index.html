<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myapp</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f7f8; color: #17171a;
    }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
    p { color: #5c5c66; margin: 0 0 1.5rem; }
    .row { display: flex; gap: .75rem; justify-content: center; }
    a.button, button.button {
      display: inline-block; padding: .6rem 1.25rem; border-radius: .5rem;
      background: #17171a; color: #fff; text-decoration: none; font-weight: 600;
      border: none; font: inherit; cursor: pointer;
    }
    a.button:hover, button.button:hover { background: #333; }
    a.button.secondary, button.button.secondary { background: transparent; color: #17171a; box-shadow: inset 0 0 0 1px #c9c9d1; }
    a.button.secondary:hover, button.button.secondary:hover { background: #ececf0; }
    footer { margin-top: 2.5rem; font-size: .8rem; color: #9a9aa3; }
  </style>
</head>
<body>
  <main>
    <!-- The Next.js consumer app. Post-auth landing here is the demo's point:
         the mantra pages may only redirect same-origin (open-redirect guard),
         so this page bridges the session to the app. -->
    <script>var APP_ORIGIN = "http://localhost:3000";</script>
    <h1>myapp</h1>
    <p id="status">Checking your session…</p>
    <div class="row" id="actions" hidden>
      <a class="button" id="cta" href="/login">Sign in</a>
      <button class="button secondary" id="signout" hidden>Sign out</button>
    </div>
    <footer>Served by Constructive static hosting.</footer>
  </main>
  <script>
    // Session-aware placeholder: the static lane cannot render server state,
    // so the page asks the anonymous who-am-i lane (same-origin, cookie rides
    // along) and presents the signed-in view when one exists. Degrades to the
    // plain sign-in view if the probe fails.
    (function () {
      var status = document.getElementById('status');
      var actions = document.getElementById('actions');
      var cta = document.getElementById('cta');
      var signout = document.getElementById('signout');
      function signedOut() {
        status.textContent = 'Your site is up. Sign in to continue.';
        cta.textContent = 'Sign in';
        cta.href = '/login';
        actions.hidden = false;
      }
      fetch('/auth/who-am-i', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (body) {
          var user = body && body.result;
          if (!user || !user.authenticated) return signedOut();
          var name = user.displayName || user.username || 'there';
          status.textContent = 'Signed in as ' + name + '.';
          cta.textContent = 'Open the app';
          cta.href = APP_ORIGIN;
          signout.hidden = false;
          actions.hidden = false;
        })
        .catch(signedOut);
      signout.addEventListener('click', function () {
        signout.disabled = true;
        fetch('/auth/sign-out', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}'
        }).catch(function () {}).finally(function () { location.reload(); });
      });
    })();
  </script>
</body>
</html>
